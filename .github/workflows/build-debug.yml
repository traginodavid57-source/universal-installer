name: Build APK Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-enabled: true

      - name: Decode Keystore and Setup key.properties
        run: |
          mkdir -p key
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > key/chave-do-app.jks
          printf "storeFile=../key/chave-do-app.jks\nstorePassword=${{ secrets.STORE_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\n" > key.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle Build Release
        run: ./gradlew :app:assembleOpensourceRelease :tv:assembleRelease

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/opensource/release/*.apk
            tv/build/outputs/apk/release/*.apk
          retention-days: 14
